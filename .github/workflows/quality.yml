name: Quality

on:
  push:
    branches: [development, master, main]
    paths:
      - '**.php'
      - 'tests/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.github/workflows/quality.yml'
  pull_request:
    paths:
      - '**.php'
      - 'tests/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.github/workflows/quality.yml'

permissions:
  contents: read

jobs:
  local-matrix:
    name: PHP ${{ matrix.php }} unit + contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, openswoole, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2
      - name: Install test dependencies
        run: composer install --working-dir=tests --no-interaction --no-progress --prefer-dist
      - name: Lint PHP
        run: composer --working-dir=tests lint
      - name: Run unit suite
        run: composer --working-dir=tests test:unit
      - name: Run contract suite
        run: composer --working-dir=tests test:contract

  static-and-style:
    name: PHPStan and PSR-12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, openswoole, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2
      - run: composer install --working-dir=tests --no-interaction --no-progress --prefer-dist
      - run: composer --working-dir=tests analyse
      - run: composer --working-dir=tests style
      - run: composer --working-dir=tests audit

  coverage:
    name: Coverage measurement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, openswoole, pdo_mysql, pdo_pgsql
          coverage: pcov
          tools: composer:v2
      - run: composer install --working-dir=tests --no-interaction --no-progress --prefer-dist
      - run: composer --working-dir=tests test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-php-8.4
          path: |
            .test-results/coverage/clover.xml
            .test-results/coverage/summary.txt

  database-integration:
    name: ${{ matrix.engine }} integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: postgres
            suite: integration-postgres
            service: postgres
          - engine: mysql
            suite: integration-mysql
            service: mysql
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, openswoole, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2
      - run: composer install --working-dir=tests --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env
      - run: docker compose --profile db config --quiet
      - run: docker compose --profile db up -d --wait ${{ matrix.service }}
      - run: composer --working-dir=tests test:${{ matrix.suite }}
      - if: always()
        run: docker compose --profile db ps
      - if: failure()
        run: docker compose --profile db logs --tail=100 ${{ matrix.service }}

  http2-integration:
    name: HTTP/2 TLS integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --working-dir=tests --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env
      - run: docker compose --profile http config --quiet
      - run: docker compose --profile http up -d --wait php-http caddy-http
      - run: docker compose --profile http run --rm http-client
      - if: always()
        run: docker compose --profile http ps
      - if: failure()
        run: docker compose --profile http logs --tail=100 caddy-http php-http
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http2-results
          path: .test-results/http2/
